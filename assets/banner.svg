<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .node-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* CSS Animations for Dynamic Dynamic Aspect */
    @keyframes pulse-line {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    .pulse-path {
      stroke-dasharray: 20, 10, 5, 10;
      animation: pulse-line 12s linear infinite;
    }
    .node-1 { animation: float-node 4s ease-in-out infinite; }
    .node-2 { animation: float-node 5s ease-in-out infinite 1s; }
    .node-3 { animation: float-node 4.5s ease-in-out infinite 0.5s; }
    .glow-circle { animation: pulse-glow 3s ease-in-out infinite alternate; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.1">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 100,0 L 100,320 M 200,0 L 200,320 M 300,0 L 300,320 M 400,0 L 400,320 M 500,0 L 500,320 M 600,0 L 600,320 M 700,0 L 700,320 M 800,0 L 800,320 M 900,0 L 900,320 M 1000,0 L 1000,320 M 1100,0 L 1100,320" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Background Glowing Orbs (Behind Dynamic Nodes & Text) -->
  <circle cx="150" cy="100" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="glow-circle" />
  <circle cx="1050" cy="220" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow)" class="glow-circle" />

  <!-- DYNAMIC ASPECT: Dynamic Data Versioning DAG Nodes & Flow (Positioned safely to sides / background) -->
  <!-- Left DAG Cluster -->
  <g class="node-1">
    <path d="M 60,220 L 120,180 L 180,240" stroke="url(#cyan-grad)" stroke-width="2" fill="none" class="pulse-path" opacity="0.6"/>
    <rect x="35" y="205" width="50" height="30" rx="6" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#subtle-glow)"/>
    <text x="60" y="224" text-anchor="middle" class="node-text">v1.0</text>
    
    <rect x="95" y="165" width="50" height="30" rx="6" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#subtle-glow)"/>
    <text x="120" y="184" text-anchor="middle" class="node-text">main</text>

    <rect x="155" y="225" width="50" height="30" rx="6" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5" filter="url(#subtle-glow)"/>
    <text x="180" y="244" text-anchor="middle" class="node-text">v1.1</text>
  </g>

  <!-- Right Dynamic Data Lineage Graph -->
  <g class="node-2">
    <path d="M 980,100 L 1050,140 L 1120,90 M 1050,140 L 1080,210" stroke="url(#primary-grad)" stroke-width="2" fill="none" class="pulse-path" opacity="0.7"/>
    
    <!-- Commit Node 1 -->
    <circle cx="980" cy="100" r="16" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#subtle-glow)"/>
    <text x="980" y="104" text-anchor="middle" class="node-text" font-size="10">RAW</text>

    <!-- Commit Node 2 -->
    <circle cx="1050" cy="140" r="18" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#subtle-glow)"/>
    <text x="1050" y="144" text-anchor="middle" class="node-text" font-size="10">CLEAN</text>

    <!-- Commit Node 3 -->
    <circle cx="1120" cy="90" r="16" fill="#1e293b" stroke="#ec4899" stroke-width="2" filter="url(#subtle-glow)"/>
    <text x="1120" y="94" text-anchor="middle" class="node-text" font-size="10">TRAIN</text>
    
    <!-- Commit Node 4 -->
    <circle cx="1080" cy="210" r="16" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#subtle-glow)"/>
    <text x="1080" y="214" text-anchor="middle" class="node-text" font-size="10">TEST</text>
  </g>

  <!-- FOREGROUND CONTENT: Clean, Readable Text and Branding -->
  <g transform="translate(600, 155)">
    <!-- Pill Badge -->
    <g transform="translate(-160, -95)">
      <rect x="0" y="0" width="320" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="160" y="18" text-anchor="middle" class="badge-text">⚡ CURATED DATASET VERSIONING ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-15" text-anchor="middle" class="title">Awesome Dataset Versioning Platform</text>
    
    <!-- Gradient Underline Bar -->
    <rect x="-220" y="5" width="440" height="4" rx="2" fill="url(#primary-grad)" />

    <!-- Subtitle -->
    <text x="0" y="42" text-anchor="middle" class="subtitle">Git-for-Data • ML Artifact Management • Data Lake Versioning • Reproducibility</text>
  </g>
</svg>
